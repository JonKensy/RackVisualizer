<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password — Rack Visualizer</title>
  <!-- Auth-gated page for local accounts only; the server re-verifies the
       current password and rejects AD-managed accounts on every POST. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Change password</h1>
    <div class="header-actions">
      <a class="button-link" href="/">Back to racks</a>
      <div class="account-menu">
        <button type="button" class="account-toggle" aria-haspopup="true" aria-expanded="false">Account ▾</button>
        <div class="account-dropdown" hidden>
          <a href="/change-password">Change password</a>
          <a href="/logout">Log out</a>
        </div>
      </div>
    </div>
  </header>
  <main class="login-main">
    <div class="login-card">
      <h2>Change local password</h2>
      <p id="cp-ad-note" class="muted" hidden>You're signed in with Active Directory and have no local account, so there's nothing to change here. Your domain password is managed by your network administrator.</p>
      <p id="cp-intro" class="muted"></p>
      <p id="cp-status" hidden></p>
      <form id="cp-form" hidden>
        <label for="cp-current">Current password
          <input id="cp-current" type="password" required autofocus autocomplete="current-password">
        </label>
        <label for="cp-new">New password
          <input id="cp-new" type="password" required minlength="8" autocomplete="new-password">
        </label>
        <label for="cp-confirm">Confirm new password
          <input id="cp-confirm" type="password" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit">Update password</button>
      </form>
    </div>
  </main>
  <script src="account.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
